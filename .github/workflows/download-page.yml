name: download-page
# Builds the download page and keeps it as an ordinary workflow artifact. It deliberately never deploys to
# GitHub Pages: a Pages site is public even when the repository is private. Deploying belongs in the public
# repository's own workflow, run by the owner when a release is published.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: download-page
          path: site
          retention-days: 7
