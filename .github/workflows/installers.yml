name: installers
on: workflow_dispatch
permissions:
  contents: read
jobs:
  desktop:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run test:audio
      - run: brew install nsis sevenzip uv
      - run: scripts/build-blocksd.sh
      - run: npm run package:dmg
      - run: npm run package:installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Keylight-desktop-installers
          path: |
            dist/*.dmg
            dist/*-Setup.exe
            dist/*.sha256
            dist/*-Setup.exe.json
            dist/*-mac.zip
            dist/*-win-x64.zip
          compression-level: 0
          retention-days: 14
