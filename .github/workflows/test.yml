name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --ignore-scripts: the unit tests don't need the Electron binary
      - run: npm ci --ignore-scripts
      - run: npm test
      # the engine self-test does: fetch it, then run the app hidden in a throwaway
      # profile until it reports (exit 0 only after SELFTEST done with no FAIL line)
      - run: node node_modules/electron/install.js
      - name: Self-test
        run: node scripts/selftest.js --expect-platform mac --profile "$RUNNER_TEMP/keylight-selftest" --timeout 300
        timeout-minutes: 10
      - name: Upload the self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-macos
          path: ${{ runner.temp }}/keylight-selftest/app.log
          if-no-files-found: ignore
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      # Electron for Windows x64, twice over: npm's electron for the self-test from source
      # (electron_config_cache) and package-win.js's copy for Keylight.exe (KEYLIGHT_CACHE).
      # Both are kept between runs, keyed on the package-lock that pins the version.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/keylight-cache
          key: electron-win32-x64-${{ hashFiles('package-lock.json') }}
      - run: node node_modules/electron/install.js
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
      # --expect-platform win: the page must say it took the Windows path (IS_WIN)
      - name: Self-test (from source)
        shell: bash
        run: node scripts/selftest.js --expect-platform win --profile "$RUNNER_TEMP/keylight-selftest" --timeout 300
        timeout-minutes: 10
      - name: Build the Windows zip
        run: npm run package:win -- --keep
        env:
          KEYLIGHT_CACHE: ${{ runner.temp }}/keylight-cache
      - name: Self-test (the packaged Keylight.exe)
        shell: bash
        run: node scripts/selftest.js --expect-platform win --exe dist/Keylight-*-win-x64/Keylight/Keylight.exe --profile "$RUNNER_TEMP/keylight-selftest-exe" --timeout 300
        timeout-minutes: 10
      - name: Upload the self-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-windows
          path: |
            ${{ runner.temp }}/keylight-selftest/app.log
            ${{ runner.temp }}/keylight-selftest-exe/app.log
          if-no-files-found: ignore
          retention-days: 14
      # a test build to try on a Windows PC (the release zip is attached to a release by hand)
      - name: Upload the Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: keylight-win-x64
          path: dist/Keylight-*-win-x64.zip
          compression-level: 0
          retention-days: 7
